---
# Install and configure the OpenVox server on the central manager. The openvox_bootstrap role runs
# BEFORE this one in the same play: the yum repository, puppet.conf (including the [server]
# section with the autosign setting) and the agent are already in place.
#
# Order inside this role: package -> configuration files -> service. A service must never start
# before the files it reads exist.

- name: Install the OpenVox server
  ansible.builtin.package:
    name: "{{ openvox_server_package }}"
    state: present

- name: Size the JVM heap of puppetserver
  ansible.builtin.lineinfile:
    path: "{{ openvox_server_sysconfig }}"
    regexp: '^JAVA_ARGS='
    # The initial (-Xms) and maximum (-Xmx) heap both take openvox_server_heap. Keeping them equal means
    # the JVM never has to resize its heap. JAVA_ARGS is one quoted string holding both options.
    line: 'JAVA_ARGS="-Xms{{ openvox_server_heap }} -Xmx{{ openvox_server_heap }}"'
  notify: Restart puppetserver

- name: Store the challenge password the autosign policy compares against
  ansible.builtin.copy:
    dest: "{{ openvox_autosign_secret_file }}"
    content: "{{ autosign_challenge }}\n"
    # The policy script runs as the user of the puppetserver service (user and group "puppet"), not as
    # root. Owner root, group puppet and mode 0640 let puppet read the secret and nobody else.
    owner: root
    group: puppet
    mode: "0640"
  no_log: true # the content is a secret

- name: Install the autosign policy script
  ansible.builtin.copy:
    src: autosign.sh
    dest: "{{ openvox_autosign_script }}"
    owner: root
    group: puppet
    mode: "0750" # executable by the puppet group, which is the service account

# The control repository (puppet/ in this repository) is copied as the "production" environment.
# Lab shortcut: a plain copy does not delete files removed from the repository, and nothing pulls
# changes automatically. In production this is r10k (or Code Manager) deploying from git.
- name: Deploy the control repository as the production environment
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../puppet/"
    dest: "{{ openvox_server_code_dir }}/environments/production/"
    owner: root
    group: puppet
    mode: "0644"
    directory_mode: "0755"

# Written AFTER the code copy, in the same environment: Hiera reads it as the top level.
- name: Write the Hiera secrets file (HTCondor pool key)
  ansible.builtin.template:
    src: secrets.yaml.j2
    dest: "{{ openvox_server_code_dir }}/environments/production/data/secrets.yaml"
    owner: root
    group: puppet
    mode: "0640"
  no_log: true # the content is a secret

- name: Enable and start puppetserver
  ansible.builtin.service:
    name: "{{ openvox_server_service }}"
    state: started
    enabled: true

# The service is "started" as soon as systemd launches the JVM, but the server only listens on 8140 one
# or two minutes later. Agents started right after (the handler of openvox_bootstrap) would get
# "Connection refused" and then wait a whole run interval (30 min) before trying again.
- name: Wait until puppetserver accepts agent connections
  ansible.builtin.wait_for:
    port: 8140
    timeout: 300
