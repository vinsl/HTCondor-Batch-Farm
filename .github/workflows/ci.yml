# Continuous integration. It never touches AWS: no credentials, no OIDC, nothing is deployed.
# Every job is a check a reviewer would run by hand; a pull request cannot go green with a red one.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  puppet:
    name: Puppet (syntax, lint, rspec-puppet)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec rake # validate (parser, EPP), lint (puppet-lint), spec (rspec-puppet)

  ansible:
    name: Ansible (ansible-lint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible ansible-lint
      - run: ansible-lint ansible/site.yml # also runs the playbook syntax check

  opentofu:
    name: OpenTofu (fmt, validate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - run: tofu fmt -check -recursive
        working-directory: tofu
      - run: tofu init -backend=false
        working-directory: tofu
      - run: tofu validate
        working-directory: tofu

  python:
    name: Python (ruff, pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pytest
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest tests -q

  security:
    name: Security (Checkov, Gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Gitleaks scans the whole history, not only the last commit
      - uses: bridgecrewio/checkov-action@v12
        with:
          config_file: .checkov.yaml
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
