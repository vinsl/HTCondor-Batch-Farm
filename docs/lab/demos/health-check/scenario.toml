title = "A sick worker removes itself from the pool, then heals"
goal = "When a critical service stops on a worker, its health check makes it refuse new jobs by itself; Puppet then repairs the service and the worker takes jobs again, with no human decision."

[[step]]
title = "Baseline: both workers are healthy"
why = "Each worker publishes NODE_IS_HEALTHY and the reason, as seen by the central manager."
host = "cm-01"
run = "condor_status -af Machine NODE_IS_HEALTHY NODE_HEALTH_REASON State"

[[step]]
title = "Break a service on wn-01"
why = "chronyd (time synchronisation) is one of the services a worker cannot run jobs without. An operator or a crash could stop it."
host = "wn-01"
become = true
run = "systemctl stop chronyd; echo \"chronyd is now: $(systemctl is-active chronyd)\""

[[step]]
title = "The worker declares itself sick"
why = "The health check runs every 60 seconds. As soon as its output changes the startd publishes it to the collector."
[step.wait_until]
host = "cm-01"
run = "condor_status -af Machine NODE_IS_HEALTHY | grep -q '^wn-01 false'"
timeout = 240
interval = 10
[step.after_wait]
host = "cm-01"
run = "condor_status -af Machine NODE_IS_HEALTHY NODE_HEALTH_REASON"

[[step]]
title = "Submit 8 jobs of 25 seconds"
why = "The queue holds more jobs than the healthy worker can run at once."
host = "cm-01"
run = "cd ~/jobs && condor_submit sleep.sub"

[[step]]
title = "Only the healthy worker runs jobs"
why = "wn-01 is excluded by its own START expression: none of the running jobs is on it."
[step.wait_until]
host = "cm-01"
run = "test $(condor_q -run -nobatch | grep -c '@wn-02') -ge 1"
timeout = 120
interval = 5
[step.after_wait]
host = "cm-01"
run = "condor_q -run -nobatch | grep -oE '@wn-[0-9]+' | sort | uniq -c; test $(condor_q -run -nobatch | grep -c '@wn-01') -eq 0"

[[step]]
title = "Why an idle job waits"
why = "condor_q -better-analyze separates 'the job asks too much' from 'the machines refuse the job': here the machines refuse."
host = "cm-01"
run = "condor_q -better-analyze $(condor_q -idle -af ClusterId ProcId | head -1 | tr ' ' .) 2>&1 | grep -E 'slots|Requirements expression'"
expect = "any"

[[step]]
title = "Puppet repairs the service"
why = "The next Puppet run notices chronyd is stopped, which is a drift from the desired state, and starts it."
host = "wn-01"
become = true
run = "/opt/puppetlabs/bin/puppet agent -t --detailed-exitcodes >/tmp/run.log 2>&1; rc=$?; grep -E 'Service.chronyd' /tmp/run.log | sed 's/\\x1b\\[[0-9;]*m//g' | cut -c1-140; echo \"puppet exit code: $rc (2 = changes applied)\"; test $rc -eq 2"

[[step]]
title = "The worker declares itself healthy again"
why = "The health check sees chronyd running, publishes True, and START accepts jobs again."
[step.wait_until]
host = "cm-01"
run = "condor_status -af Machine NODE_IS_HEALTHY | grep -q '^wn-01 true'"
timeout = 240
interval = 10
[step.after_wait]
host = "cm-01"
run = "condor_status -af Machine NODE_IS_HEALTHY NODE_HEALTH_REASON"

[[step]]
title = "Let the first batch finish"
why = "So the next batch starts from an empty queue."
[step.wait_until]
host = "cm-01"
run = "test $(condor_q -nobatch -af ClusterId | wc -l) -eq 0"
timeout = 300
interval = 10
[step.after_wait]
host = "cm-01"
run = "condor_q -nobatch | tail -1"

[[step]]
title = "A new batch runs on both workers"
why = "The proof that wn-01 is back in service."
host = "cm-01"
run = "cd ~/jobs && condor_submit sleep.sub"
[step.wait_until]
host = "cm-01"
run = "test $(condor_q -run -nobatch | grep -oE '@wn-[0-9]+' | sort -u | wc -l) -ge 2"
timeout = 120
interval = 5

[[step]]
title = "Jobs per worker"
why = "Running jobs, grouped by worker."
host = "cm-01"
run = "condor_q -run -nobatch | grep -oE '@wn-[0-9]+' | sort | uniq -c"
