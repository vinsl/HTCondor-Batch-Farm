/* Layout: one full-bleed 3D stage; instrument panels float over it, inset by --gutter.
   Colour: one hue per tool, taken from the README badges; neutrals lean towards the AlmaLinux navy. */
:root {
  --stage-a: #F3F6FA; --stage-b: #DAE2EC;
  --panel: rgba(255, 255, 255, .9); --panel-solid: #FFFFFF; --sunk: rgba(27, 39, 68, .055);
  --rule: rgba(27, 39, 68, .14); --rule-strong: rgba(27, 39, 68, .32);
  --ink: #141C2E; --ink-2: #465270; --ink-3: #6B7791;
  --tofu: #844FBA; --ansible: #EE0000; --vox: #F59E0B; --condor: #0E7490; --out: #66748E; --alma: #1E3A8A;
  --ok: #128A52; --bad: #C92A1E; --focus: #1E3A8A;
  --display: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --gutter: 16px; --radius: 6px;
  --shadow: 0 1px 2px rgba(20, 28, 46, .06), 0 8px 28px rgba(20, 28, 46, .10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --stage-a: #0C1322; --stage-b: #070B15;
    --panel: rgba(16, 23, 40, .9); --panel-solid: #101728; --sunk: rgba(170, 192, 240, .08);
    --rule: rgba(170, 192, 240, .16); --rule-strong: rgba(170, 192, 240, .38);
    --ink: #EAF0FB; --ink-2: #A6B4D2; --ink-3: #7F8DAB;
    --tofu: #A46FE0; --ansible: #FF4040; --vox: #F7A823; --condor: #3CC0DC; --out: #8E9DBC; --alma: #7C9BF0;
    --ok: #2FD98B; --bad: #FF6257; --focus: #9DB6FF;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 32px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --stage-a: #0C1322; --stage-b: #070B15;
  --panel: rgba(16, 23, 40, .9); --panel-solid: #101728; --sunk: rgba(170, 192, 240, .08);
  --rule: rgba(170, 192, 240, .16); --rule-strong: rgba(170, 192, 240, .38);
  --ink: #EAF0FB; --ink-2: #A6B4D2; --ink-3: #7F8DAB;
  --tofu: #A46FE0; --ansible: #FF4040; --vox: #F7A823; --condor: #3CC0DC; --out: #8E9DBC; --alma: #7C9BF0;
  --ok: #2FD98B; --bad: #FF6257; --focus: #9DB6FF;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 32px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--stage-b); color: var(--ink); font: 14px/1.45 var(--body); -webkit-font-smoothing: antialiased; overflow: hidden; }
*, *::before, *::after { box-sizing: border-box; }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, label.filebtn { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: .92em; font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.eyebrow { font: 500 11px/1.3 var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); }

/* ------------------------------------------------------------- the stage */
.app { position: relative; height: 100%; overflow: hidden; }
.stage { position: absolute; inset: 0; background: linear-gradient(180deg, var(--stage-a), var(--stage-b)); touch-action: none; cursor: grab; outline-offset: -3px; }
.stage.dragging { cursor: grabbing; }
.stage.pointing { cursor: pointer; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#ov { pointer-events: none; }
.hint { position: absolute; left: var(--gutter); bottom: 14px; max-width: 250px; font: 400 11.5px/1.3 var(--mono); color: var(--ink-3); pointer-events: none; transition: opacity .6s; }
.hint.gone, .app[data-inspector="open"] .hint { opacity: 0; }
@media (max-width: 1500px) { .hint { bottom: 70px; } }
.fallback { position: absolute; inset: 30% 10% auto; text-align: center; color: var(--ink-2); }
.tip { position: absolute; z-index: 5; pointer-events: none; max-width: 300px; padding: 5px 9px; border-radius: 4px; background: var(--ink); color: var(--panel-solid); font: 500 12.5px/1.35 var(--display); letter-spacing: .01em; box-shadow: var(--shadow); }
.tip small { display: block; font: 400 11px/1.35 var(--mono); opacity: .78; }

/* ------------------------------------------------- masthead and legend */
.left { position: absolute; top: var(--gutter); left: var(--gutter); display: flex; flex-direction: column; gap: 18px; max-width: min(420px, 60vw); pointer-events: none; }
.left > * { pointer-events: auto; }
.masthead { display: flex; flex-direction: column; gap: 5px; }
.masthead h1 { font: 600 29px/1.05 var(--display); letter-spacing: -.005em; text-wrap: balance; }
.masthead .meta { font: 400 12px/1.4 var(--mono); color: var(--ink-2); }
.masthead .facts { display: flex; flex-direction: column; gap: 1px; margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--rule); font: 400 12px/1.45 var(--mono); color: var(--ink); align-self: flex-start; }
.legend { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
.legend button { display: grid; grid-template-columns: 26px auto auto; align-items: center; column-gap: 9px; padding: 3px 8px 3px 4px; border-radius: 4px; }
.legend button:hover { background: var(--sunk); }
.legend .swatch { height: 4px; border-radius: 2px; background: var(--c); }
.legend .swatch.dashed { background: repeating-linear-gradient(90deg, var(--c) 0 6px, transparent 6px 10px); }
.legend .name { font: 600 13.5px/1.2 var(--display); }
.legend .what { font: 400 11.5px/1.2 var(--mono); color: var(--ink-2); }
.legend button[aria-pressed="false"] { opacity: .42; }
.legend button[aria-pressed="false"] .name { text-decoration: line-through; }

/* ---------------------------------------------------------------- toolbar */
.toolbar { position: absolute; top: var(--gutter); right: var(--gutter); display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 1px; padding: 1px; border-radius: var(--radius); background: var(--rule); box-shadow: var(--shadow); }
.toolbar > button, .toolbar .menu > button, .toolbar .filebtn { display: block; padding: 7px 12px; background: var(--panel-solid); font: 600 13px/1.25 var(--display); letter-spacing: .01em; white-space: nowrap; }
.toolbar > :first-child { border-radius: 5px 0 0 5px; }
.toolbar > :last-child { border-radius: 0 5px 5px 0; }
.toolbar button:hover, .toolbar .filebtn:hover { background: color-mix(in srgb, var(--panel-solid) 88%, var(--ink)); }
.toolbar button[aria-pressed="true"], .toolbar button[aria-expanded="true"] { background: var(--ink); color: var(--panel-solid); }
.filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.filebtn:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
.menu { position: relative; }
.menu-list { position: absolute; z-index: 6; top: calc(100% + 6px); right: 0; min-width: 232px; padding: 5px; border-radius: var(--radius); background: var(--panel-solid); border: 1px solid var(--rule); box-shadow: var(--shadow); }
.menu-list button { display: flex; justify-content: space-between; gap: 18px; width: 100%; padding: 7px 9px; border-radius: 4px; font: 600 13px/1.25 var(--display); text-align: left; }
.menu-list button span { font: 400 11.5px/1.3 var(--mono); color: var(--ink-2); }
.menu-list button:hover { background: var(--sunk); }

/* -------------------------------------------------------------- inspector */

.sec.flash h3 { color: var(--ink); border-bottom-color: var(--rule-strong); }
.kv { display: grid; grid-template-columns: minmax(104px, 38%) minmax(0, 1fr); gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--ink-2); }
.kv dd { min-width: 0; overflow-wrap: anywhere; }
.plain li { overflow-wrap: anywhere; }
.plain li + li { margin-top: 1px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--rule-strong); font: 400 11.5px/1.5 var(--mono); color: var(--ink-2); }
.chip.ok::before, .chip.bad::before, .dot { content: ""; flex: none; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.chip.bad::before, .dot.bad { background: var(--bad); }
.state { display: inline-flex; align-items: center; gap: 6px; }
.tablewrap { overflow-x: auto; min-width: 0; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }

.bar .fill { display: block; height: 100%; min-width: 2px; background: var(--condor); border-radius: 2px; }

.dock { position: absolute; left: 50%; bottom: var(--gutter); transform: translateX(-50%); width: min(880px, calc(100% - 2 * var(--gutter))); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }

/** Tiny DOM builder: el('div', {class:'x', onclick}, child, 'text', [more]) */
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else if (k === 'style' && typeof v === 'object') { for (const p in v) { if (p.startsWith('--')) n.style.setProperty(p, v[p]); else n.style[p] = v[p]; } }
      else n.setAttribute(k, v === true ? '' : v);
    }
  }
  const add = c => {
    if (c == null || c === false) return;
    if (Array.isArray(c)) c.forEach(add);
    else n.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
  };
  kids.forEach(add);

}

function buildModel(S) {
  const infra = S.infrastructure || {};
  const nodes = S.nodes || {};
  const machines = (infra.machines || []).map(m => Object.assign({}, m, { node: nodes[m.name] || {} }));
  if (!machines.length) throw new Error('This file has no infrastructure.machines: it is not a lab snapshot.');
  const cm = machines.find(m => m.role === 'central_manager') || machines[0];
  const workers = machines.filter(m => m !== cm);

  const pool = (cm.node.htcondor) || {};
  const slots = pool.pool_slots || [];
  const history = pool.history || {};
  const byHost = history.completed_by_host || {};
  const completed = (history.by_status && history.by_status.completed) || Object.values(byHost).reduce((a, b) => a + b, 0);
  // Hosts that ran jobs but no longer exist (the scale-out worker, destroyed before this capture)
  const ghosts = Object.keys(byHost).filter(h => !machines.some(m => m.name === h)).sort();

  const server = (cm.node.puppet && typeof cm.node.puppet.server === 'object') ? cm.node.puppet.server : {};
  const slotOf = name => slots.find(s => s.Machine === name) || null;

  const runs = machines.map(m => ((m.node.puppet || {}).last_run || {}).resources || {});
  const totals = runs.map(r => r.total).filter(n => n != null);
  const rules = infra.security_group_rules || [];
  const sgName = (rules.map(r => /members of (\S+)/.exec(r.peer || '')).find(Boolean) || [])[1] || 'security group';

  return {
    raw: S, infra, machines, cm, workers, ghosts, pool, slots, history, byHost, completed, server, slotOf, rules, sgName,
    net: infra.network || {},
    milestone: S.milestone || 'snapshot',
    captured: S.captured_at,
    git: S.git || {},
    facts: {
      machines: machines.length,
      slots: slots.length,
      healthySlots: slots.filter(s => s.NODE_IS_HEALTHY === true).length,
      healthKnown: slots.some(s => s.NODE_IS_HEALTHY != null),
      cpus: slots.reduce((a, s) => a + (s.TotalCpus || s.Cpus || 0), 0),
      completed,
      changed: runs.reduce((a, r) => a + (r.changed || 0), 0),
      failed: runs.reduce((a, r) => a + (r.failed || 0), 0),
      resMin: totals.length ? Math.min.apply(null, totals) : null,
      resMax: totals.length ? Math.max.apply(null, totals) : null,
      certs: Object.keys(server.signed_certificates || {}).length,
      pending: (server.pending_requests || []).length,
    },
  };
}

  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);

}

/** A plate w (x) by d (z), h tall, sitting on y = 0: rounded in plan, chamfered top and bottom. */
function plateGeom(w, h, d, r, bevel) {
  r = r == null ? 0.1 : r;
  bevel = Math.min(bevel == null ? 0.03 : bevel, h / 2 - 0.002);
  const g = new THREE.ExtrudeGeometry(rrShape(w - 2 * bevel, d - 2 * bevel, r - bevel), {
    depth: h - 2 * bevel, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 1, curveSegments: 5, steps: 1,
  });

}

/** Outline of a plate's top face, as a closed line. */
function plateOutline(w, h, d, r, bevel, material) {
  r = r == null ? 0.1 : r; bevel = bevel == null ? 0.03 : bevel;

  return new THREE.LineLoop(g, material);

/** Polyline with filleted corners, as an arc-length parameterised path. */
function roundedPath(pts, radius) {
  const path = new THREE.CurvePath();
  let prev = pts[0].clone();
  for (let i = 1; i < pts.length - 1; i++) {
    const p = pts[i];
    const dIn = p.clone().sub(pts[i - 1]), dOut = pts[i + 1].clone().sub(p);
    const rr = Math.min(radius, dIn.length() / 2, dOut.length() / 2);
    const pIn = p.clone().addScaledVector(dIn.normalize(), -rr);
    const pOut = p.clone().addScaledVector(dOut.normalize(), rr);
    if (prev.distanceTo(pIn) > 1e-4) path.add(new THREE.LineCurve3(prev, pIn));
    path.add(new THREE.QuadraticBezierCurve3(pIn, p.clone(), pOut));
    prev = pOut;
  }
  const last = pts[pts.length - 1].clone();
  if (prev.distanceTo(last) > 1e-4) path.add(new THREE.LineCurve3(prev, last));
  return path;
}

function tubeGeom(curve, radius) {
  const len = curve.getLength();
  return new THREE.TubeGeometry(curve, Math.max(6, Math.ceil(len * 7)), radius, 8, false);
}

/** Cone pointing along a curve at parameter `at` (default: its end); `reverse` points it back along the curve. */
function arrowHead(curve, radius, material, at, reverse) {
  const t = at == null ? 1 : at;
  const g = new THREE.ConeGeometry(radius * 2.6, radius * 7, 14);
  g.translate(0, -radius * 3.5, 0);
  const m = new THREE.Mesh(g, material);
  m.position.copy(curve.getPointAt(t));
  const dir = curve.getTangentAt(clamp(t, 0.001, 0.999)).normalize();
  m.quaternion.setFromUnitVectors(new V3(0, 1, 0), reverse ? dir.negate() : dir);
  return m;
}

/** Repeating dash pattern (opaque / transparent) used as a map on build-time flows. */
let _dashCanvas = null;
function dashTexture(repeat) {

    _dashCanvas = document.createElement('canvas'); _dashCanvas.width = 64; _dashCanvas.height = 4;
    const c = _dashCanvas.getContext('2d');

/**
 * One line of text printed flat on a surface (or upright on a wall).
 * parts: [{t, f: 'cap' | 'mono' | 'disp', a: alpha}]. Drawn white, tinted by the material colour.
 * Returns a mesh whose origin is the left / centre / right end of the baseline box.
 */
function printedText(parts, unitH, opts) {
  opts = opts || {};
  const px = 72, pad = 10, H = 104;
  const cv = document.createElement('canvas');
  let c = cv.getContext('2d');
  const fontOf = p => (p.f === 'mono' ? FONT.mono(500, px * 0.86) : FONT.disp(600, px));
  const track = p => (p.f === 'cap' ? px * 0.085 : 0);
  const str = p => (p.f === 'cap' ? String(p.t).toUpperCase() : String(p.t));
  const widthOf = p => {
    c.font = fontOf(p);
    const s = str(p);
    return track(p) ? Array.from(s).reduce((a, ch) => a + c.measureText(ch).width + track(p), 0) : c.measureText(s).width;
  };
  const gap = px * 0.34;
  const total = parts.reduce((a, p) => a + widthOf(p), 0) + gap * (parts.length - 1);
  cv.width = Math.min(4096, Math.ceil(total + pad * 2)); cv.height = H;
  c = cv.getContext('2d');
  c.textBaseline = 'alphabetic'; c.fillStyle = '#fff';
  let x = pad;
  for (const p of parts) {
    c.font = fontOf(p); c.globalAlpha = p.a == null ? 1 : p.a;
    const s = str(p);
    if (track(p)) { for (const ch of Array.from(s)) { c.fillText(ch, x, H * 0.72); x += c.measureText(ch).width + track(p); } }
    else { c.fillText(s, x, H * 0.72); x += c.measureText(s).width; }
    x += gap;
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.encoding = THREE.sRGBEncoding; tex.anisotropy = 16;
  const w = (cv.width / px) * unitH, h = (cv.height / px) * unitH;
  const g = new THREE.PlaneGeometry(w, h);
  const ax = opts.align === 'right' ? -w / 2 : opts.align === 'center' ? 0 : w / 2;
  g.translate(ax, 0, 0);
  if (!opts.upright) g.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(g, opts.material);
  m.material.map = tex; m.material.needsUpdate = true;
  m.userData.span = [ax - w / 2, ax + w / 2, h * 0.5];   // local x extent and text height, for label avoidance
  return m;
}

/** Drafting-table grid under the model: world-space lines, anti-aliased in the shader, fading out with distance. */
function gridMaterial() {
  return new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    extensions: { derivatives: true },
    uniforms: { color: { value: new THREE.Color() }, alpha: { value: 1 }, radius: { value: 46 }, px: { value: 1 }, centre: { value: new THREE.Vector2(0, 3) } },
    vertexShader: 'varying vec3 vPos; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vPos = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }',
    fragmentShader: [
      'varying vec3 vPos; uniform vec3 color; uniform float alpha; uniform float radius; uniform float px; uniform vec2 centre;',
      'float grid(vec2 c){ vec2 g = abs(fract(c - 0.5) - 0.5) / (fwidth(c) * px); return 1.0 - min(min(g.x, g.y), 1.0); }',
      'void main(){',
      '  vec2 c = vPos.xz;',
      '  float a = grid(c) * 0.55 + grid(c / 5.0) * 0.75;',
      '  float fade = 1.0 - smoothstep(radius * 0.3, radius, length(c - centre));',
      '  gl_FragColor = vec4(color, clamp(a, 0.0, 1.0) * alpha * fade);',
      '}',
    ].join('\n'),
  });
}

/* ------------------------------------------------ model -> 3D scene graph */
const DIM = {

  SLAB: 0.22, FENCE_H: 0.9, FENCE_SIDE: 0.95, MIN_WIDTH: 21.5,

  GAP: 0.05, EXPLODE: 0.6,
  LANE_SSH: 2.6, LANE_OUT: 3.3, FENCE_F: 4.3, FENCE_B: -2.55, GATE_X: 0.5,

function buildWorld(model) {

  const pickable = (mesh, pick) => { mesh.userData.pick = pick; W.picks.push(mesh); return mesh; };

    return m;
  }

  const ledMat = () => new THREE.MeshBasicMaterial();
  function led(parent, node, service, on, lx, ly, lz, top) {
    const g = top ? new THREE.CylinderGeometry(0.11, 0.11, 0.06, 20) : new THREE.BoxGeometry(0.15, 0.1, 0.04);
    const m = new THREE.Mesh(g, ledMat());
    m.position.set(lx, ly, lz); m.userData.state = on === undefined ? 'off' : on ? 'ok' : 'bad';
    parent.add(m); W.leds[node + ':' + service] = m;
    return m;
  }
  const socket = (parent, lx, ly, lz, key) => box(parent, 0.36, 0.15, 0.07, lx, ly, lz, flat(key || 'port'));
  const zF = D.ND / 2, zFw = (D.ND * MS) / 2;   // front face of a machine: local, world

  function buildNode(cell, isCM) {
    const m = cell.m, name = m.name, node = m.node || {};
    const sv = serviceStates(m), sys = node.system || {}, pup = node.puppet || {}, htc = node.htcondor || {}, cfg = htc.config || {};
    const pk = node.packages || {}, classes = pup.classes || [];
    const ver = s => String(s || '').split('-')[0];
    const pick = part => ({ kind: 'node', id: name, part });
    const info = W.nodes[name] = { name, isCM, cell, items: {}, cells: [] };
    const fullW = isCM ? D.NW + D.COLGAP + D.SW : D.NW;
    const fullX = isCM ? (cell.x0 + cell.x1) / 2 : cell.x;
    const dx = (cell.x - fullX) / MS;   // node stack centre, relative to the chassis centre (machine units)
    const note = (id, obj, lx, ly, lz, text, o) => {
      anchor(name + ':' + id, obj, lx, ly, lz);
      label(Object.assign({ id: name + ':' + id, kind: 'note', anchor: name + ':' + id, text, level: 2, prio: 2, node: name, pick: pick(id) }, o));
    };
    const side = (it, w, text, right, part) => note('s-' + it.id, it.group, right ? w / 2 : -w / 2, it.hl / 2, zF, text, { side: right ? 'right' : 'left', exploded: true, since: it.since, pick: pick(part) });

    // 1. what OpenTofu creates: the instance, booted from the AlmaLinux image
    const colBase = column(fullX, 0);
    colBase.baseY = yFloor;
    const vol = m.root_volume || {};
    const chassis = stratum(colBase, 'chassis', H.chassis, 1, name, g => {
      plate(g, { w: fullW, h: H.chassis, d: D.ND, r: 0.14, key: 'chassis', pick: pick('instance') });
      socket(g, dx - 0.55, 0.1, zF + 0.02, 'ansible'); socket(g, dx + 0.55, 0.1, zF + 0.02, 'out');
      anchor(name + ':p22', g, dx - 0.55, 0.055, zF + 0.05); anchor(name + ':pout', g, dx + 0.55, 0.055, zF + 0.05);
    });
    side(chassis, fullW, [m.instance_type, sys.cpus != null ? sys.cpus + ' vCPU' : null, sys.memory_mib != null ? sys.memory_mib + ' MiB' : null,
      vol.size_gib ? `${vol.size_gib} GiB ${vol.type || ''}${vol.encrypted ? ' encrypted' : ''}` : null].filter(Boolean).join(' · '), false, 'instance');
    const os = stratum(colBase, 'os', H.os, 1, name, g => { plate(g, { w: fullW, h: H.os, d: D.ND, r: 0.14, key: 'alma', pick: pick('system') }); });
    side(os, fullW, [(sys.os || 'AlmaLinux').replace(/\s*\(.*\)/, ''), sys.selinux ? 'SELinux ' + sys.selinux : null].filter(Boolean).join(' · '), false, 'system');

    // 2. what Ansible adds: the OpenVox agent (and, on the central manager, the server)
    const col = column(cell.x, 0, colBase);
    const agent = stratum(col, 'agent', H.agent, 2, name, g => {
      plate(g, { w: D.NW, h: H.agent, d: D.ND, r: 0.14, key: 'vox', pick: pick('openvox') });
      led(g, name, 'puppet', sv.puppet, 1.0, H.agent / 2, zF + 0.012);
      // 3. the signed certificate, with the role written inside
      const seal = plate(g, { w: 0.62, h: 0.18, d: 0.05, r: 0.02, bevel: 0.012, key: 'secret', x: -0.82, y: H.agent / 2 - 0.09, z: zF + 0.02, outline: false, shadow: false, pick: pick('certificate') });
      appearable(seal, 3, 'scale');
      anchor(name + ':seal', g, -0.82, H.agent / 2, zF + 0.05);
      anchor(name + ':agentL', g, -D.NW / 2, H.agent / 2, -0.55); anchor(name + ':agentR', g, D.NW / 2, H.agent / 2, -0.55);
    });
    side(agent, D.NW, ['openvox-agent ' + ver(pk['openvox-agent']), pup.runinterval_s ? 'run every ' + Math.round(pup.runinterval_s / 60) + ' min' : null].filter(Boolean).join(' · '), false, 'openvox');
    const cert = pup.certificate || {};
    if (cert.pp_role) label({ id: name + ':cert', kind: 'note', anchor: name + ':seal', text: 'certificate: pp_role = ' + cert.pp_role, level: 2, prio: 3, node: name, side: 'down', since: 3, pick: pick('certificate'), storyOnly: 3 });

    // 4. what OpenVox converges: the shared profiles, then the role's own
    const has = c => classes.indexOf(c) >= 0;
    const base = stratum(col, 'base', H.base, 4, name, g => {
      plate(g, { w: D.NW, h: H.base, d: D.ND, r: 0.14, key: 'base', pick: pick('services') });
      ['chronyd', 'sshd', 'firewalld'].forEach((s, i) => led(g, name, s, sv[s], -1.0 + i * 0.24, H.base / 2, zF + 0.012));
      anchor(name + ':chronyd', g, -1.0, H.base / 2, zF + 0.04);
    });
    // the services this layer keeps running: read from the catalog when it is in the snapshot, else from systemd
    const managed = (pup.resources || []).map(r => /^service\[(.+)\]$/.exec(r)).filter(Boolean).map(r => r[1]).filter(s => s !== 'condor');
    const baseSvcs = managed.length ? managed : ['chronyd', 'sshd', 'firewalld'].filter(s => s in sv);
    side(base, D.NW, (has('profile::base') ? 'profile::base' : 'base') + (baseSvcs.length ? ' · ' + baseSvcs.join(', ') : ''), false, 'services');
    const condor = stratum(col, 'condor', H.condor, 4, name, g => {
      plate(g, { w: D.NW, h: H.condor, d: D.ND, r: 0.14, key: 'condor', pick: pick('htcondor') });
      led(g, name, 'condor', sv.condor, 1.0, H.condor / 2, zF + 0.012);
      socket(g, 0.5, H.condor / 2, zF + 0.02);
    });
    side(condor, D.NW, [(has('profile::htcondor') ? 'profile::htcondor' : 'HTCondor') + ' · condor ' + ver(pk.condor), htc.pool_key_present ? 'pool key' : null, (htc.daemon_tokens || []).length ? 'token' : null].filter(Boolean).join(', '), false, 'htcondor');

    const blockW = 1.12, off = 0.63;
    const deck = stratum(col, 'deck', H.block, 4, name, g => {
      const block = (id, text, lx, lz) => {
        const b = plate(g, { w: blockW, h: H.block, d: blockW, r: 0.1, key: 'condorLight', x: lx, z: lz, pick: pick('htcondor') });
        note(id, b, 0, H.block, 0, text, { side: 'up', since: 4 });
        return b;
      };
      const tray = (w, lx, lz) => plate(g, { w, h: 0.1, d: blockW, r: 0.1, key: 'condorPale', x: lx, z: lz, pick: pick('htcondor') });
      if (isCM) {
        const coll = block('collector', 'collector', -off, -off); block('negotiator', 'negotiator', off, -off);
        const sch = block('schedd', 'schedd', -off, off);
        const q = tray(blockW, off, off);
        const qn = Object.keys(htc.queue || {}).length;
        note('queue', q, 0, 0.1, 0, 'job queue: ' + (qn ? qn + ' states' : 'empty'), { side: 'up', since: 4 });
        anchor(name + ':schedd', sch, 0, H.block, 0); anchor(name + ':collector', coll, 0, H.block, 0); anchor(name + ':queue', q, 0, 0.1, 0);
      } else {
        const st = block('startd', 'startd', -off, -off);
        const hb = block('health', 'health check' + (cfg.STARTD_CRON_HEALTH_PERIOD ? ' · every ' + cfg.STARTD_CRON_HEALTH_PERIOD : ''), off, -off);
        const slot = model.slotOf(name);
        const known = slot && slot.NODE_IS_HEALTHY != null;   // a pool without the health check publishes nothing
        if (cfg.STARTD_CRON_JOBLIST || known) led(hb, name, 'health', known ? slot.NODE_IS_HEALTHY === true : undefined, 0, H.block + 0.03, 0, true);
        const t = tray(2.38, 0, off);
        const ncpu = clamp(Math.round((slot && (slot.TotalCpus || slot.Cpus)) || sys.cpus || 2), 1, 4);
        for (let i = 0; i < ncpu; i++) {
          const cw = Math.min(0.9, 2.1 / ncpu - 0.12), cx = (i - (ncpu - 1) / 2) * (2.1 / ncpu);
          const cellMesh = plate(t, { w: cw, h: 0.05, d: 0.84, r: 0.07, bevel: 0.012, key: 'condor', x: cx, y: 0.1, outline: false, shadow: false });
          info.cells.push({ obj: cellMesh, p: new V3(0, 0.05, 0), job: null });
        }
        if (slot) note('slot', t, 0, 0.16, 0.2, `${String(slot.Name || 'slot').split('@')[0]} · ${slot.Cpus} CPU · ${slot.Memory} MiB · ${slot.State}`, { side: 'down', since: 4 });
        anchor(name + ':slot', t, 0, 0.16, 0); anchor(name + ':startd', st, 0, H.block, 0); anchor(name + ':health', hb, 0, H.block + 0.1, 0);
      }
      anchor(name + ':top', g, isCM ? -dx : 0, H.block + 0.25, 0);
    });
    const roleClass = classes.find(c => /^role::/.test(c));
    side(deck, D.NW, classes.filter(c => /^profile::htcondor::/.test(c)).join(' + ') || (isCM ? 'central manager daemons' : 'execute daemons'), false, 'htcondor');
    Object.assign(info.items, { chassis, os, agent, base, condor, deck });

    if (isCM) {
      const srv = model.server;
      const colS = column(cell.srvX, 0, colBase);
      const ps = stratum(colS, 'server', H.server, 2, name, g => {
        plate(g, { w: D.SW, h: H.server, d: D.ND, r: 0.14, key: 'voxDeep', pick: pick('server') });
        if ('puppetserver' in sv) led(g, name, 'puppetserver', sv.puppetserver, 0.66, H.server - 0.2, zF + 0.012);
        socket(g, -0.4, H.server - 0.2, zF + 0.02);
        anchor(name + ':srvL', g, -D.SW / 2, H.agent / 2, -0.55);
        anchor(name + ':p8140', g, -0.4, H.server - 0.2, zF + 0.06);
      });
      const jvm = /-Xmx(\w+)/.exec(srv.java_args || '');
      side(ps, D.SW, ['openvox-server ' + ver(pk['openvox-server']), jvm ? 'JVM ' + jvm[1] : null, 'listens on 8140'].filter(Boolean).join(' · '), true, 'server');
      const hier = srv.hiera_hierarchy || [];
      const sdeck = stratum(colS, 'sdeck', H.block, 2, name, g => {
        const ca = plate(g, { w: 1.5, h: H.block, d: 1.0, r: 0.1, key: 'vox', z: -0.66, pick: pick('server') });
        anchor(name + ':ca', ca, 0, H.block, 0);
        const nSigned = Object.keys(srv.signed_certificates || {}).length;
        note('ca', ca, 0, H.block, 0, `CA + autosign policy · ${nSigned} signed, ${(srv.pending_requests || []).length} pending`, { side: 'up', since: 2, pick: pick('server') });
        // Hiera: one sheet per level, the first match on top
        const n = Math.max(1, hier.length);
        const sheetH = Math.min(0.08, (H.block - 0.04 * (n - 1)) / n);
        hier.slice().reverse().forEach((lv, i) => {
          const top = i === n - 1;
          plate(g, { w: 1.5 - (n - 1 - i) * 0.0, h: sheetH, d: 1.06, r: 0.06, bevel: 0.012, key: /secret/i.test(lv.path + lv.name) ? 'secret' : (i % 2 ? 'voxPale' : 'vox'), x: 0, y: i * (sheetH + 0.04), z: 0.66, pick: pick('hiera') });
          if (top) anchor(name + ':hiera', g, 0, i * (sheetH + 0.04) + sheetH, 0.66);
        });
        if (hier.length) label({ id: name + ':hiera', kind: 'note', anchor: name + ':hiera', text: `Hiera · ${hier.length} levels, first match wins`, level: 2, prio: 2, node: name, side: 'down', since: 2, pick: pick('hiera') });
      });
      side(sdeck, D.SW, 'admission and data', true, 'server');
      Object.assign(info.items, { server: ps, sdeck });
    }

    // the tag above the machine
    const slot = model.slotOf(name);
    label({
      id: name, kind: 'tag', anchor: name + ':top', title: name, node: name, level: 1, prio: 10, pick: pick(null), since: 1,
      // the story fills the tag in as the machine gets its role (step 3) and its slot (step 4)
      lines: st => [st === 0 || st >= 3 ? (roleClass || ('role: ' + (m.role || 'n/a'))) : null, [m.instance_type, m.private_ip].filter(Boolean).join(' · ')],
      health: (st, live) => (st > 0 && st < 4 ? null : live !== undefined ? live : slot && slot.NODE_IS_HEALTHY != null ? slot.NODE_IS_HEALTHY === true : null),
    });
    info.fullX = fullX;
    info.x0 = cell.x0; info.x1 = cell.x1;
  }

  buildNode(cmCell, true);
  cells.filter(c => !c.ghost).forEach(c => buildNode(c, false));

  /* -------------------------------------------- completed jobs, by worker */
  const cube = 0.25, pitch = 0.31, perRow = 3, perLayer = 12;
  const jobGeom = new THREE.BoxGeometry(cube, cube, cube);
  function pallet(cell) {
    const n = model.byHost[cell.m.name] || 0;
    const g = new THREE.Group(); g.position.set(cell.palletX, yFloor, cell.ghost ? 0 : 0.35); W.root.add(g); appearable(g, 5);
    const pick = cell.ghost ? { kind: 'ghost', id: cell.m.name } : { kind: 'jobs', id: cell.m.name };
    plate(g, { w: D.PALLET_W + 0.12, h: 0.07, d: D.PALLET_D + 0.12, r: 0.06, bevel: 0.015, key: 'steel', pick });
    if (n) {
      const im = new THREE.InstancedMesh(jobGeom, new THREE.MeshStandardMaterial({ roughness: 0.7 }), n);
      const mx = new THREE.Matrix4();
      for (let i = 0; i < n; i++) {
        const layer = Math.floor(i / perLayer), k = i % perLayer;
        mx.makeTranslation((k % perRow - 1) * pitch, 0.07 + cube / 2 + layer * (cube + 0.02), (Math.floor(k / perRow) - 1.5) * pitch);
        im.setMatrixAt(i, mx);
      }
      im.castShadow = true; im.receiveShadow = true; pickable(im, pick); g.add(im);
      W.onTheme.push(P => { for (let i = 0; i < n; i++) im.setColorAt(i, srgb((i * 7) % 3 === 0 ? P.jobAlt : P.job)); im.instanceColor.needsUpdate = true; });
    }
    const layers = Math.ceil(n / perLayer);
    anchor(cell.m.name + ':pallet', g, 0, 0.07 + layers * (cube + 0.02) + 0.12, 0);
    anchor(cell.m.name + ':palletDrop', g, 0, 0.07 + layers * (cube + 0.02) + cube / 2, 0);
    label({ id: cell.m.name + ':jobs', kind: 'note', anchor: cell.m.name + ':pallet', text: plural(n, 'job'), mono: true, level: 1, prio: 5, side: cell.ghost ? 'right' : 'up', pick, since: 5 });
  }
  cells.forEach(pallet);

  /* ---- a worker that ran jobs and was then destroyed (the scale-out demonstration) */
  cells.filter(c => c.ghost).forEach(cell => {
    const g = new THREE.Group(); g.position.set(cell.x, yFloor, 0); W.root.add(g); appearable(g, 5);
    const dm = reg(new THREE.LineDashedMaterial({ dashSize: 0.16, gapSize: 0.12, transparent: true }), 'ghost', 'printAlpha');
    const hgt = (H.chassis + H.os + H.agent + H.base + H.condor + H.block + D.GAP * 5) * MS;
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(nw, hgt, nw)), dm);
    edges.position.y = hgt / 2; edges.computeLineDistances(); g.add(edges);
    const fill = box(g, nw, hgt, nw, 0, hgt / 2, 0, flat('ghost', { transparent: true, opacity: 0.05, depthWrite: false }), { kind: 'ghost', id: cell.m.name });
    fill.renderOrder = 1;
    anchor(cell.m.name + ':top', g, 0, hgt + 0.25, 0);
    label({ id: cell.m.name, kind: 'tag', anchor: cell.m.name + ':top', title: cell.m.name, ghost: true, level: 1, prio: 7, pick: { kind: 'ghost', id: cell.m.name }, since: 5,
      lines: CONTEXT.goneWorker });
  });

  /* --------------------------------------------------------------- flows */
  const flowGroup = id => { const g = new THREE.Group(); W.root.add(g); return (W.flows[id] = { id, def: FLOWS.find(f => f.id === id), group: g, paths: [], on: true }); };
  const R = 0.05;
  function tube(flow, curve, o) {
    o = o || {};
    const len = curve.getLength();
    let mat;
    if (o.dashed) {
      mat = flat(flow.def.key, { map: dashTexture(len / 0.5), alphaTest: 0.5 });
      W.dashed.push({ mat, period: 0.5, flow: flow.id });
    } else mat = flow.mat || (flow.mat = flat(flow.def.key));
    const m = new THREE.Mesh(tubeGeom(curve, o.r || R), mat);
    flow.group.add(m);
    const fat = new THREE.Mesh(new THREE.TubeGeometry(curve, Math.max(4, Math.ceil(len * 2)), 0.2, 5, false), fatMat);
    pickable(fat, { kind: 'flow', id: flow.id }); fat.userData.flow = flow.id; flow.group.add(fat);
    return m;
  }
  const head = (flow, curve, at, reverse) => { const h = arrowHead(curve, R, flow.headMat || (flow.headMat = flat(flow.def.key)), at, reverse); flow.group.add(h); return h; };
  const fatMat = new THREE.MeshBasicMaterial({ visible: false });
  const P3 = (px, py, pz) => new V3(px, py, pz);
  const ramp = (px, ya, yb, z, dir) => [P3(px, ya, z - 0.14 * dir), P3(px, yb, z + 0.14 * dir)];   // step between two slabs, dir = travel direction along z
  const yT = [0.055, yRegion + 0.055, yVpc + 0.055, yFloor + 0.055];
  W.resolve = id => { const a = W.anchors[id]; return a ? a.obj.localToWorld(a.p.clone()) : null; };
  const allNodes = [cmCell].concat(cells.filter(c => !c.ghost));

  // --- OpenTofu -> AWS API (build time)
  const fTofu = flowGroup('tofu');
  const apiX = (region.x0 + vpc.x0) / 2, apiZ = 1.2;
  const api = new THREE.Mesh(new THREE.CylinderGeometry(0.27, 0.27, 0.1, 28), std('tofu')); api.position.set(apiX, yRegion + 0.05, apiZ); api.castShadow = true;
  pickable(api, { kind: 'flow', id: 'tofu' }); W.root.add(api); appearable(api, 1);
  anchor('api', api, 0, 0.3, 0);
  label({ id: 'api', kind: 'note', anchor: 'api', text: 'AWS API', level: 1, prio: 6, side: 'left', flow: 'tofu', pick: { kind: 'flow', id: 'tofu' } });
  // the inventory OpenTofu writes for Ansible
  const inv = new THREE.LineCurve3(P3(wsX - 0.62, 0.74, outerZ - 0.75), P3(wsX + 0.56, 0.74, outerZ - 0.75));
  tube(fTofu, inv, { dashed: true }); head(fTofu, inv);
  anchor('inventory', gWs, 0, 0.94, -0.75);
  label({ id: 'inventory', kind: 'note', anchor: 'inventory', text: 'generated inventory', level: 2, prio: 2, side: 'up', pick: { kind: 'flow', id: 'tofu' } });

  // --- Ansible over SSH (build time): workspace -> gateway -> gate 22 -> every node
  const fSsh = flowGroup('ssh'), fOut = flowGroup('out');
  function bus(flow, laneZ, jx, yLift, trunkPts, portOf, inbound, dashed) {
    const y = yT[3] + yLift;
    const junction = P3(jx, y, laneZ);
    const trunk = roundedPath(inbound ? trunkPts.concat([junction]) : [junction].concat(trunkPts), 0.3);
    tube(flow, trunk, { dashed });
    if (!inbound) head(flow, trunk);
    flow.trunk = trunk;
    const xs = allNodes.map(c => portOf(c).x);
    for (const sideSign of [-1, 1]) {
      const far = sideSign < 0 ? Math.min.apply(null, xs) : Math.max.apply(null, xs);
      if ((far - jx) * sideSign <= 0.01) continue;
      const a = junction, b = P3(far, y, laneZ);
      tube(flow, new THREE.LineCurve3(inbound ? a : b, inbound ? b : a), { dashed });
    }
    allNodes.forEach(c => {
      const p = portOf(c), onLane = P3(p.x, y, laneZ), port = P3(p.x, y, p.z);
      const drop = new THREE.LineCurve3(inbound ? onLane : port, inbound ? port : onLane);
      tube(flow, drop, { dashed });
      if (inbound) head(flow, drop);
      // the whole route, for pulses
      const lane = [junction, onLane].filter((q, i, arr) => i === 0 || q.distanceTo(arr[0]) > 0.02);
      const route = inbound ? trunkPts.concat(lane, [port]) : [port].concat(lane.slice().reverse(), trunkPts);
      flow.paths.push({ curve: roundedPath(route, 0.3), node: c.m.name });
    });
  }
  const zIgw = vpc.z1;
  const through = (gx, ySide) => [   // from the fence gate out to the ground in front of the region, through the gateway
    P3(gx, yT[3] + ySide, fence.z1),
  ].concat(ramp(gx, yT[3] + ySide, yT[2] + ySide, subnet.z1, 1), ramp(gx, yT[2] + ySide, yT[1] + ySide, zIgw, 1), ramp(gx, yT[1] + ySide, yT[0] + ySide, region.z1, 1), [P3(gx, yT[0] + ySide, region.z1 + 1.1)]);
  W.root.updateMatrixWorld(true);
  const sshTrunk = [P3(wsX + 1.3, 0.2 + 0.055, outerZ - 1.4)]
    .concat(ramp(wsX + 1.3, 0.255, yT[0] + 0.012, outerZ - 1.8, -1), [P3(wsX + 1.3, yT[0] + 0.012, region.z1 + 1.1)], through(-D.GATE_X, 0.012).reverse());
  bus(fSsh, D.LANE_SSH, -D.GATE_X, 0.012, sshTrunk, c => W.resolve(c.m.name + ':p22'), true, true);
  const outTrunk = through(D.GATE_X, 0).concat([P3(exX, yT[0], region.z1 + 1.1), P3(exX, yT[0], outerZ - 1.9)]);
  bus(fOut, D.LANE_OUT, D.GATE_X, 0, outTrunk, c => W.resolve(c.m.name + ':pout'), false, false);
  label({ id: 'f-ssh', kind: 'chip', flow: 'ssh', curve: () => fSsh.trunk, ts: [0.3, 0.2, 0.42, 0.1], text: fSsh.def.chip, color: 'ansible', level: 1, prio: 8, pick: { kind: 'flow', id: 'ssh' } });
  label({ id: 'f-out', kind: 'chip', flow: 'out', curve: () => fOut.trunk, ts: [0.72, 0.82, 0.6, 0.9], text: fOut.def.chip, color: 'out', level: 1, prio: 8, pick: { kind: 'flow', id: 'out' } });
  const rule = (dir, re) => model.rules.find(r => r.direction === dir && re.test(String(r.ports) + ' ' + r.protocol));
  const r22 = rule('inbound', /^22-22/), rOut = rule('outbound', /./);

/* ------------------------------------------------- orbit camera and framing */
const FOV = 22;

/** Where to put a camera looking from (theta, phi) so that every point fits the viewport minus padding. */
function fitView(points, theta, phi, aspect, pad) {
  pad = Object.assign({ l: 0.04, r: 0.04, t: 0.06, b: 0.05 }, pad);
  const cam = new THREE.PerspectiveCamera(FOV, aspect, 0.1, 1000);
  const dir = new V3(Math.sin(phi) * Math.sin(theta), Math.cos(phi), Math.sin(phi) * Math.cos(theta));
  const box = new THREE.Box3().setFromPoints(points);
  const target = box.getCenter(new V3());
  let dist = box.getSize(new V3()).length() * 1.3;
  const x0 = -1 + 2 * pad.l, x1 = 1 - 2 * pad.r, y0 = -1 + 2 * pad.b, y1 = 1 - 2 * pad.t;

    cam.position.copy(target).addScaledVector(dir, dist); cam.lookAt(target); cam.updateMatrixWorld(true);

    for (const p of points) { q.copy(p).project(cam); a = Math.min(a, q.x); b = Math.max(b, q.x); lo = Math.min(lo, q.y); hi = Math.max(hi, q.y); }
    const s = Math.max((b - a) / (x1 - x0), (hi - lo) / (y1 - y0));

  }

}

function OrbitCam(dom, camera) {

/* --------------------------------- screen-space labels, drawn on a 2D canvas */
/* Drawn with the canvas API rather than DOM so that a PNG export contains exactly what is on screen. */
function LabelLayer(W, view) {
  const mctx = document.createElement('canvas').getContext('2d');

  const textW = (font, s) => {
    const key = font + '\u0001' + s;

  };

    if (l.flow && !view.flowShown(l.flow)) return false;
    if (l.steps && l.steps.indexOf(view.step) < 0) return false;
    if (view.compact && l.kind === 'note' && l.level !== 2 && l.id !== 'heal') return false;   // phone: names and flows only
    if (l.level !== 2) return true;
    const sel = !!(l.node && view.selected && view.selected.kind === 'node' && view.selected.id === l.node);
    if (l.storyOnly && l.storyOnly === view.step) return true;
    // exploded: the shared layers are named once, on the central manager; every machine names its own daemons
    const first = l.node === W.model.cm.name;
    if (l.exploded) return sel || view.labels === 'all' || (view.explode > 0.5 && first);
    if (view.labels === 'all' || sel) return true;
    if (view.explode > 0.5) return l.side === 'up' || first;

  }

      s.title = val(l.title); s.lines = view.compact ? [] : (val(l.lines, l) || []).filter(Boolean); s.health = val(l.health, l);
      const extra = (l.color ? 15 * k : 0) + (s.health != null ? 15 * k : 0);

        left: [sx - 13 * k - s.w, sy - s.h / 2], right: [sx + 13 * k, sy - s.h / 2],

    const free = (x, y, w, h, strict) => !hitsAny(placed, x, y, w, h, m) && !(strict && hitsAny(printed, x, y, w, h, 0));
    for (const s of shapes) {
      let spot = null;
      for (const strict of [true, false]) {
        for (const c of s.cands) {
          const x = clamp(c[0], 4 * k, Math.max(4 * k, vw - s.w - 4 * k)), y = clamp(c[1], 4 * k, Math.max(4 * k, vh - s.h - 4 * k));
          if (free(x, y, s.w, s.h, strict)) { spot = [x, y]; break; }
        }
        if (spot) break;
      }
      if (!spot) { if (s.l.kind !== 'tag') continue; spot = [clamp(s.cands[0][0], 4 * k, vw - s.w - 4 * k), clamp(s.cands[0][1], 4 * k, vh - s.h - 4 * k)]; }
      s.x = spot[0]; s.y = spot[1];
      placed.push(s);
    }
    return placed.slice(nReserved);
  }

  function rr(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }

  /** Draw every label for `camera` into ctx (vw x vh canvas units); k scales type for exports; `reserved` are rectangles to keep clear. */
  function draw(c, camera, vw, vh, k, P, store, reserved) {
    const L = P.label, placed = layout(camera, vw, vh, k, reserved);
    const samePick = (a, b) => a && b && a.kind === b.kind && a.id === b.id;
    c.save(); c.textBaseline = 'alphabetic'; c.lineJoin = 'round';
    // leaders first, so that boxes sit on top of them
    for (const s of placed) {
      if (s.l.kind === 'chip') continue;
      const cx = clamp(s.sx, s.x + 4 * k, s.x + s.w - 4 * k), cy = s.sy < s.y ? s.y : s.sy > s.y + s.h ? s.y + s.h : s.sy;
      const ex = s.sx < s.x ? s.x : s.sx > s.x + s.w ? s.x + s.w : cx;
      c.strokeStyle = L.leader; c.lineWidth = 1 * k; c.beginPath(); c.moveTo(s.sx, s.sy); c.lineTo(ex, cy); c.stroke();
      c.fillStyle = L.leader; c.beginPath(); c.arc(s.sx, s.sy, 1.8 * k, 0, 7); c.fill();
    }
    for (const s of placed) {
      const l = s.l, hot = samePick(l.pick, view.hover) || samePick(l.pick, view.selected);
      if (l.kind === 'tag') {
        rr(c, s.x, s.y, s.w, s.h, 5 * k);
        c.fillStyle = L.card; c.fill();
        c.lineWidth = (hot ? 1.6 : 1) * k; c.strokeStyle = hot ? L.text : L.border;
        if (l.ghost) c.setLineDash([4 * k, 3 * k]);
        c.stroke(); c.setLineDash([]);
        let tx = s.x + 9 * k; const ty = s.y + (s.lines.length ? 6 : 4.5) * k + 14 * k;
        if (l.color) { c.fillStyle = P[l.color]; rr(c, tx, ty - 9.5 * k, 9 * k, 9 * k, 2 * k); c.fill(); tx += 15 * k; }
        c.font = s.fTitle; c.fillStyle = l.ghost ? L.sub : L.text; c.fillText(s.title, tx, ty);
        const h = s.health;
        if (h != null) { c.fillStyle = h ? P.ok : P.bad; c.beginPath(); c.arc(s.x + s.w - 13 * k, ty - 5 * k, 4 * k, 0, 7); c.fill(); }
        c.font = s.fLine; c.fillStyle = L.sub;
        s.lines.forEach((t, i) => c.fillText(t, s.x + 9 * k, ty + (i + 1) * 13.5 * k + 1 * k));
      } else if (l.kind === 'chip') {
        const bg = P[l.color] || P.out;
        rr(c, s.x, s.y, s.w, s.h, s.h / 2); c.fillStyle = bg; c.fill();
        if (hot) { c.lineWidth = 1.6 * k; c.strokeStyle = L.text; c.stroke(); }
        c.font = s.font; c.fillStyle = lum(bg) > 0.42 ? '#141C2E' : '#FFFFFF';
        c.fillText(s.text, s.x + 8 * k, s.y + s.h / 2 + 3.7 * k);
      } else {
        c.font = s.font; c.lineWidth = 3.6 * k; c.strokeStyle = L.halo;
        c.strokeText(s.text, s.x + 2 * k, s.y + 11.5 * k);
        c.fillStyle = l.tone ? P[val(l.tone)] : (hot ? L.text : L.sub); c.fillText(s.text, s.x + 2 * k, s.y + 11.5 * k);
      }
    }
    c.restore();
    if (store) hits = placed.filter(s => s.l.pick).map(s => ({ x: s.x, y: s.y, w: s.w, h: s.h, pick: s.l.pick }));
  }
  let hits = [];
  const hit = (x, y) => { for (const h of hits) if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) return h.pick; return null; };
  return { draw, hit };
}

/* ----------------------------- the six steps, pulses, and the two replays */
/* The resting scene is the snapshot. Everything that moves here is an illustration of the README's
   "How it works": pulses along the flows, jobs travelling to slots, and the self-healing demonstration. */
const STEP_FLOWS = { 1: ['tofu'], 2: ['ssh', 'out'], 3: ['vox'], 4: ['vox', 'out'], 5: ['condor'], 6: ['condor', 'vox'] };
const HEAL_PHASES = [
  { until: 3.5, name: 'Healthy', text: 'Both workers publish NODE_IS_HEALTHY = true and receive jobs.' },
  { until: 5.2, name: 'chronyd stopped', text: 'chronyd is stopped by hand on the worker.' },
  { until: 11, name: 'Refuses jobs', text: 'The health check publishes false: the START expression of the worker rejects new jobs, which all go to the other worker.' },
  { until: 13, name: 'OpenVox repairs', text: 'The next agent run sees the stopped service as drift and starts it (corrective change).' },
  { until: 17.5, name: 'Healthy again', text: 'The health check publishes true again and the worker takes jobs.' },
];

function Story(W, view, scene) {
  const model = W.model;
  const S = { step: 0, t: 0, phase: 0, onPhase: null, userFlows: {}, pulses: [], jobs: [], healthy: {}, sick: null };
  FLOWS.forEach(f => { S.userFlows[f.id] = true; });
  view.flowShown = id => S.userFlows[id] && (S.step === 0 || (STEP_FLOWS[S.step] || []).indexOf(id) >= 0);

  const matOf = {};
  // materials made here join the theme registry (and take the current colour if a theme is already on)
  const mat = (key, lit) => {
    if (matOf[key]) return matOf[key];
    const m = lit ? new THREE.MeshStandardMaterial({ roughness: 0.7, metalness: 0 }) : new THREE.MeshBasicMaterial();
    W.mats.push({ m, key }); if (W.P) m.color.copy(srgb(W.P[key]));
    return (matOf[key] = m);
  };
  const pulseGeom = new THREE.SphereGeometry(0.095, 14, 10);
  const jobGeom = new THREE.BoxGeometry(0.24, 0.24, 0.24);
  const layer = new THREE.Group(); W.root.add(layer);

  /* ---- pulses: beads that travel along a flow */
  function addPulses(flowId, spacing, speed) {
    const f = W.flows[flowId]; if (!f) return;
    f.paths.forEach((p, i) => {
      if (p.short) return;
      const n = Math.max(1, Math.round(p.curve.getLength() / spacing));
      for (let k = 0; k < n; k++) {
        const m = new THREE.Mesh(pulseGeom, mat(f.def.key)); layer.add(m);
        S.pulses.push({ m, flow: flowId, path: i, phase: k / n + i * 0.37, speed, node: p.node });
      }
    });
  }
  addPulses('tofu', 5, 3.2); addPulses('ssh', 7, 4.2); addPulses('out', 9, 3.0); addPulses('vox', 6, 2.4); addPulses('condor', 7, 2.2);

  // which flows carry pulses at each step, and in which direction (+1 = along the drawn curve)
  function pulseMode(p) {
    const st = S.step;
    if (REDUCED_MOTION || !view.flowShown(p.flow)) return 0;
    if (st === 0) return p.flow === 'vox' ? 0.45 : p.flow === 'condor' ? -0.45 : p.flow === 'out' ? 0.45 : 0;
    if (p.flow === 'condor') return -0.6;                        // slot advertisements, worker -> collector
    if (p.flow === 'vox' && st === 4) return (p.phase * 10 | 0) % 2 ? 1 : -1;   // requests up, catalogs down
    if (p.flow === 'vox' && st === 6) return S.phase === 3 && p.node === S.sick ? 1.6 : 0;
    return 1;
  }

  /* ---- jobs: queued on the schedd, matched to a free slot, run, then stacked as completed */
  const cmName = model.cm.name;
  const workerNames = model.workers.map(w => w.name).filter(n => W.nodes[n] && W.nodes[n].cells.length);
  let spawnIn = 0, rr = 0, seq = 0;
  function resetJobs() {
    S.jobs.forEach(j => layer.remove(j.m)); S.jobs = [];
    workerNames.forEach(n => W.nodes[n].cells.forEach(c => { c.job = null; }));
    spawnIn = 0.2;
  }
  const cellPos = c => c.obj.localToWorld(c.p.clone()).add(new V3(0, 0.13, 0));
  function queueSpot(i) { const q = W.resolve(cmName + ':queue'); return q ? q.add(new V3((i - 1) * 0.3, 0.13, 0)) : null; }
  function updateJobs(dt) {
    if (!workerNames.length || !W.flows.condor.paths.length) return;
    const queued = S.jobs.filter(j => j.state === 'queued');
    spawnIn -= dt;
    if (spawnIn <= 0 && queued.length < 3) {
      const m = new THREE.Mesh(jobGeom, mat('job', true)); m.castShadow = true; layer.add(m);
      const j = { m, state: 'queued', age: 0, id: seq++ }; S.jobs.push(j); queued.push(j);
      spawnIn = 0.55;
    }
    queued.forEach((j, i) => { const p = queueSpot(i); if (p) j.m.position.lerp(p, j.age === 0 ? 1 : 0.2); });
    // negotiation: the oldest queued job goes to the next healthy worker with a free CPU
    const first = queued[0];
    if (first && first.age > 0.35) {
      for (let k = 0; k < workerNames.length; k++) {
        const name = workerNames[(rr + k) % workerNames.length];
        if (S.healthy[name] === false) continue;
        const cell = W.nodes[name].cells.find(c => !c.job);
        if (!cell) continue;
        cell.job = first; rr = (rr + k + 1) % workerNames.length;
        Object.assign(first, { state: 'fly', node: name, cell, u: 0, from: first.m.position.clone() });
        break;
      }
    }
    for (const j of S.jobs.slice()) {
      j.age += dt;
      if (j.state === 'queued') { j.m.scale.setScalar(Math.min(1, j.age * 5)); continue; }
      if (j.state === 'fly') {
        const path = W.flows.condor.paths.find(p => p.node === j.node);
        j.u = Math.min(1, j.u + (dt * 5.2) / path.curve.getLength());
        const k = ease.inOut(j.u), p = path.curve.getPointAt(k);
        const a = clamp(k / 0.12, 0, 1), b = clamp((k - 0.86) / 0.14, 0, 1);
        p.lerpVectors(j.from, p, a).lerp(cellPos(j.cell), b);
        j.m.position.copy(p); j.m.rotation.set(k * 6, k * 4, 0);
        if (j.u >= 1) { j.state = 'run'; j.timer = 1.5 + ((j.id * 37) % 10) / 10; j.m.rotation.set(0, 0, 0); }
      } else if (j.state === 'run') {
        j.timer -= dt; j.m.position.copy(cellPos(j.cell)); j.m.rotation.y += dt * 2.5;
        if (j.timer <= 0) { j.state = 'done'; j.u = 0; j.from = j.m.position.clone(); j.to = W.resolve(j.node + ':palletDrop'); j.cell.job = null; }
      } else {
        j.u = Math.min(1, j.u + dt / 0.5);
        j.m.position.lerpVectors(j.from, j.to, j.u); j.m.position.y += Math.sin(j.u * Math.PI) * 0.9;
        j.m.rotation.y = 0;
        if (j.u >= 1) { layer.remove(j.m); S.jobs.splice(S.jobs.indexOf(j), 1); }
      }
    }
  }

  /* ---- self-healing replay on the first worker */
  const snapLed = {};
  for (const k in W.leds) snapLed[k] = W.leds[k].userData.state;
  function restoreSnapshotState() {
    for (const k in snapLed) W.setLed(k, snapLed[k]);
    S.healthy = {}; S.sick = null; S.phase = 0; view.extraLabels = [];
  }
  function setPhase(i) {
    if (i === S.phase && S.sick) return;
    S.phase = i;
    const w = S.sick = workerNames[0]; if (!w) return;
    const chrony = i === 1 || i === 2, healthy = !(i === 2 || i === 3);
    W.setLed(w + ':chronyd', chrony ? 'bad' : 'ok');
    W.setLed(w + ':health', healthy ? 'ok' : 'bad');
    S.healthy[w] = healthy;
    const notes = [null,
      { anchor: w + ':chronyd', text: 'chronyd stopped', tone: 'bad', side: 'left' },
      { anchor: w + ':health', text: 'NODE_IS_HEALTHY = false · service chronyd is not active', tone: 'bad', side: 'up' },
      { anchor: w + ':chronyd', text: 'OpenVox: chronyd stopped → running (corrective)', tone: 'vox', side: 'left' },
      { anchor: w + ':health', text: 'NODE_IS_HEALTHY = true', tone: 'ok', side: 'up' }];
    view.extraLabels = notes[i] ? [Object.assign({ id: 'heal', kind: 'note', level: 1, prio: 12, mono: true }, notes[i])] : [];
    if (S.onPhase) S.onPhase(i);
  }
  view.nodeHealth = name => (name in S.healthy ? S.healthy[name] : undefined);

  /* ---- step changes */
  S.set = function (n) {
    const prev = S.step;
    S.step = view.step = n; S.t = 0;
    let i = 0;
    for (const a of W.appear) {
      const show = n === 0 || a.since <= n;
      const fresh = show && n > 0 && prev !== 0 && !a.shown || (show && n > 0 && a.since === n);
      a.shown = show;
      a.t = fresh && !REDUCED_MOTION ? -(i++) * 0.045 : 1;
    }
    W.applyAppear();
    restoreSnapshotState(); resetJobs();
    if (n === 6) { S.phase = -1; setPhase(0); }
    S.syncFlows();
  };
  S.syncFlows = function () { for (const id in W.flows) W.flows[id].group.visible = view.flowShown(id); };
  S.toggleFlow = function (id, on) { S.userFlows[id] = on; S.syncFlows(); };

  S.update = function (dt) {
    S.t += dt;
    // parts dropping into place
    let moving = false;
    for (const a of W.appear) if (a.t < 1) { a.t = Math.min(1, a.t + dt / 0.6); moving = true; }
    if (moving) { W.applyAppear(); if (W.items.some(it => it.ap.t < 1)) W.rebuildArcs(); }
    // marching dashes on the build-time flows while their step is on
    for (const d of W.dashed) if (!REDUCED_MOTION && ((S.step === 1 && d.flow === 'tofu') || (S.step === 2 && d.flow === 'ssh'))) d.mat.map.offset.x -= (dt * 1.6) / d.period;
    // pulses
    for (const p of S.pulses) {
      const mode = pulseMode(p), path = W.flows[p.flow].paths[p.path];
      p.m.visible = !!mode && !!path;
      if (!p.m.visible) continue;
      const len = path.curve.getLength();
      let u = (((S.t * p.speed * mode) / len + p.phase) % 1 + 1) % 1;
      p.m.position.copy(path.curve.getPointAt(u));
      p.m.scale.setScalar(Math.min(1, Math.min(u, 1 - u) * 12 + 0.15));
    }
    if (S.step >= 5 && !REDUCED_MOTION) updateJobs(dt);
    if (S.step === 6 && !REDUCED_MOTION) {
      const total = HEAL_PHASES[HEAL_PHASES.length - 1].until, tt = S.t % total;
      setPhase(HEAL_PHASES.findIndex(p => tt < p.until));
    }
  };

  /** Facts shown under each step's caption, all read from the snapshot. */
  S.facts = function (n) {
    const f = model.facts, infra = model.infra, net = model.net, srv = model.server;
    const ver = (pkg, node) => String(((node || model.cm).node.packages || {})[pkg] || '').split('-')[0];
    const wcfg = ((model.workers[0] || {}).node || {}).htcondor ? model.workers[0].node.htcondor.config || {} : {};
    const range = f.resMin === f.resMax ? String(f.resMin) : `${f.resMin}–${f.resMax}`;
    const certs = Object.values(srv.signed_certificates || {});
    switch (n) {
      case 0: return [plural(f.machines, 'machine'), f.healthKnown ? `${f.healthySlots} of ${plural(f.slots, 'slot')} healthy` : plural(f.slots, 'slot'), `${plural(f.completed, 'job')} completed`, `${f.changed} of ${range} resources changed`, `${plural(f.pending, 'certificate request')} pending`];
      case 1: return [`region ${infra.region}`, `VPC ${net.vpc_cidr}`, `subnet ${(net.subnet || {}).cidr}`, plural(model.rules.length, 'security group rule'), plural(f.machines, 'machine'), (infra.image || {}).name].filter(Boolean);
      case 2: return [`openvox-agent ${ver('openvox-agent')}`, `openvox-server ${ver('openvox-server')}`, 'SSH allowed from one /32', `key pair ${infra.key_pair}`];
      case 3: return [`${plural(f.certs, 'certificate')} signed`, `${f.pending} pending`, certs.length && certs.every(c => c.contains_challenge_password === false) ? 'challenge password kept in certificates: no' : null,
        srv.autosign ? 'policy ' + String(srv.autosign).split('/').pop() : null, certs[0] && certs[0].issuer ? String(certs[0].issuer).replace('CN=', '') : null].filter(Boolean);
      case 4: return [`${f.changed} changed, ${f.failed} failed at the last run`, `${range} resources per node`, `Hiera: ${(srv.hiera_hierarchy || []).length} levels`, `environment ${(srv.environments || []).join(', ')}`];
      case 5: return [`${plural(f.slots, 'slot')}, ${plural(f.cpus, 'CPU')}`, `${plural(f.completed, 'job')} completed`].concat(Object.keys(model.byHost).map(h => `${h}: ${model.byHost[h]}`));
      case 6: return [wcfg.START ? 'START = ' + wcfg.START : null, wcfg.STARTD_CRON_HEALTH_PERIOD ? 'check every ' + wcfg.STARTD_CRON_HEALTH_PERIOD : null,
        wcfg.STARTD_CRON_AUTOPUBLISH ? 'autopublish ' + wcfg.STARTD_CRON_AUTOPUBLISH : null].filter(Boolean);
    }
    return [];
  };
  S.dispose = function () { W.root.remove(layer); };
  S.syncFlows();
  return S;
}

/* ------------------------- the detail panel: everything the snapshot holds */
function Inspector(root, model, hooks) {
  const S = model.raw, infra = model.infra, net = model.net, srv = model.server;
  const has = v => v != null && v !== '';
  const kv = rows => el('dl', { class: 'kv' }, rows.filter(r => r && has(r[1])).map(r => [el('dt', null, r[0]), el('dd', { class: r[2] === false ? null : 'mono' }, r[1])]));
  const sec = (id, title, ...kids) => el('section', { class: 'sec', id: 'sec-' + id }, el('h3', null, title), kids);
  const chip = (text, tone) => el('span', { class: 'chip' + (tone ? ' ' + tone : '') }, text);
  const table = (heads, rows) => el('div', { class: 'tablewrap' }, el('table', null,
    el('thead', null, el('tr', null, heads.map(h => el('th', null, h)))),
    el('tbody', null, rows.map(r => el('tr', null, r.map(c => el('td', null, c == null ? '–' : c)))))));
  const dot = ok => el('span', { class: 'dot ' + (ok ? 'ok' : 'bad'), 'aria-hidden': 'true' });
  const state = (ok, text) => el('span', { class: 'state' }, dot(ok), text);
  const list = items => el('ul', { class: 'plain mono' }, items.map(i => el('li', null, i)));
  const p = text => el('p', null, text);
  const raw = obj => el('details', { class: 'raw' }, el('summary', null, 'Raw snapshot data'), el('pre', null, JSON.stringify(obj, null, 2)));
  const sgFor = port => { const r = model.rules.find(x => x.direction === 'inbound' && String(x.ports) === `${port}-${port}`); return r ? r.peer : null; };

  function bars(byHost) {
    const max = Math.max(1, ...Object.values(byHost));
    return el('div', { class: 'bars' }, Object.keys(byHost).sort().map(h => {
      const gone = model.ghosts.indexOf(h) >= 0;
      return el('div', { class: 'bar' + (gone ? ' gone' : '') }, el('span', { class: 'mono' }, h),
        el('span', { class: 'track' }, el('span', { class: 'fill', style: { width: (byHost[h] / max * 100).toFixed(1) + '%' } })),
        el('span', { class: 'mono num' }, String(byHost[h])));
    }));
  }

  /* ------------------------------------------------------------- a machine */
  function nodeView(name) {
    const m = model.machines.find(x => x.name === name); if (!m) return null;
    const n = m.node || {}, sys = n.system || {}, pup = n.puppet || {}, htc = n.htcondor || {}, isCM = m === model.cm;
    const svc = n.services || {}, fw = (n.network || {}).firewall || {}, listen = (n.network || {}).listening_tcp || [];
    const run = pup.last_run || {}, res = run.resources || {}, cert = pup.certificate || {}, vol = m.root_volume || {};
    const slot = model.slotOf(name);
    const active = Object.values(svc).filter(s => s.active === 'active').length, nsvc = Object.keys(svc).length;
    const role = (pup.classes || []).find(c => /^role::/.test(c)) || m.role;
    const fwOpen = port => (fw.ports || []).indexOf(port + '/tcp') >= 0 || (port === 22 && (fw.services || []).indexOf('ssh') >= 0);

    const out = [];
    out.push(el('div', { class: 'chips' },
      slot && slot.NODE_IS_HEALTHY != null ? chip(slot.NODE_IS_HEALTHY ? 'healthy' : 'unhealthy', slot.NODE_IS_HEALTHY ? 'ok' : 'bad') : null,
      nsvc ? chip(`${active}/${nsvc} services active`, active === nsvc ? 'ok' : 'bad') : null,
      res.total != null ? chip(`${res.changed} of ${res.total} resources changed`, res.failed ? 'bad' : 'ok') : null));

    out.push(sec('instance', 'Instance', kv([
      ['Type', m.instance_type], ['Availability zone', m.availability_zone], ['Private address', m.private_ip],
      ['Public address', fmt.yesno(m.has_public_ip), false],
      ['Root volume', vol.size_gib ? `${vol.size_gib} GiB ${vol.type || ''}${vol.encrypted ? ', encrypted' : ', not encrypted'}` : null],
      ['IMDSv2 required', fmt.yesno(m.imdsv2_required), false], ['Key pair', m.key_pair]])));

    if (n.system) out.push(sec('system', 'System', kv([
      ['OS', sys.os], ['Kernel', sys.kernel], ['Architecture', sys.arch], ['CPUs', sys.cpus], ['Memory', has(sys.memory_mib) ? sys.memory_mib + ' MiB' : null],
      ['Root disk', has(sys.root_disk_gib) ? `${sys.root_disk_gib} GiB, ${sys.root_disk_free_pct} % free` : null], ['SELinux', sys.selinux], ['Uptime', sys.uptime],
      ['Fleet in /etc/hosts', (sys.etc_hosts_fleet || []).length ? list(sys.etc_hosts_fleet) : null, false]])));

    if (nsvc) out.push(sec('services', 'Services', table(['Service', 'Boot', 'State', 'Since (UTC)'],
      Object.keys(svc).map(k => [el('span', { class: 'mono' }, k), svc[k].enabled, state(svc[k].active === 'active', svc[k].active), el('span', { class: 'mono' }, fmt.since(svc[k].since))]))));

    if (listen.length) out.push(sec('network', 'Listening ports',

      if (pick.id === 'vox') body.push(sec('runs', 'Last agent runs', table(['Machine', 'At (UTC)', 'Resources', 'Changed'], model.machines.map(m => { const r = (m.node.puppet || {}).last_run || {}; return [el('span', { class: 'mono' }, m.name), el('span', { class: 'mono' }, r.at ? fmt.time(r.at).replace(' UTC', '') : null), (r.resources || {}).total, (r.resources || {}).changed]; }))));

/* ------------------------------------------------------------ PNG export */
/* Renders the 3D view at an exact size, then draws labels, legend and caption on top with the canvas API,
   so the image is the same whether it comes from the button or from a headless render. */
const EXPORTS = {
  readme: { w: 2400, h: 1350, file: 'hero', view: 'hero', title: false },
  linkedin: { w: 2400, h: 1256, file: 'linkedin', view: 'hero', title: true, compact: true, phi: 1.08 },
  square: { w: 2160, h: 2160, file: 'square', view: 'hero', title: true, compact: true, theta: -1.0, phi: 0.9 },
  current: { file: 'view', view: 'current', title: false },
};

function renderImage(app, o) {
  const { renderer, scene, camera, W, labels, view, model } = app;
  const P = PALETTE[o.theme || app.theme], L = P.label;
  const cssW = app.size.w, cssH = app.size.h;
  let w = o.w, h = o.h;
  if (!w) { w = 2400; h = Math.round((2400 * cssH) / cssW); }
  const k = w / 1280;                                  // type scale: legible once the image is shown ~1000 px wide
  const m = 0.03 * w, dot = '  ·  ', f = model.facts;
  const gl = renderer.getContext();
  const ss = Math.max(w, h) * 2 <= Math.min(gl.getParameter(gl.MAX_RENDERBUFFER_SIZE), 6000) ? 2 : 1;

  // --- the text around the picture, measured first so that the model and its labels keep clear of it
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const c = cv.getContext('2d');
  c.textBaseline = 'alphabetic';
  const lines = [];                                    // [{y, parts: [[text, font, colour]]}]
  let y = m + 11 * k;
  const facts = [plural(f.machines, 'machine'), f.healthKnown ? `${f.healthySlots} of ${plural(f.slots, 'slot')} healthy` : plural(f.slots, 'slot'),
    `${plural(f.completed, 'job')} completed`, `${plural(f.changed, 'resource')} changed at the last run`].join(dot);
  if (o.title) {
    lines.push({ y, parts: [[`LAB SNAPSHOT · ${String(model.milestone).toUpperCase()}`, FONT.mono(500, 12.5 * k), L.sub]] });
    y += 44 * k; lines.push({ y, parts: [[CONTEXT.project, FONT.disp(600, 40 * k), L.text]] });
    y += 27 * k; lines.push({ y, parts: [['OpenTofu', 'tofu'], [' provisions, ', null], ['Ansible', 'ansible'], [' bootstraps, ', null], ['OpenVox', 'vox'], [' configures, ', null], ['HTCondor', 'condor'], [' schedules.', null]]
      .map(s => [s[0], FONT.body(s[1] ? 600 : 400, 15.5 * k), s[1] ? P[s[1]] : L.sub]) });
    y += 23 * k;
  }
  lines.push({ y, parts: [[facts, FONT.mono(500, 12 * k), o.title ? L.sub : L.text]] });
  const reserved = lines.map(ln => { const tw = ln.parts.reduce((a, p) => { c.font = p[1]; return a + c.measureText(p[0]).width; }, 0); return { x: 0, y: ln.y - 40 * k, w: m + tw + 12 * k, h: 48 * k }; });
  reserved.push({ x: 0, y: h - m - 26 * k, w, h: m + 26 * k });
  const top = (y + 12 * k) / h;

  // --- save the live view, then set up the shot
  const saved = { theme: app.theme, aspect: camera.aspect, pos: camera.position.clone(), quat: camera.quaternion.clone(), pr: renderer.getPixelRatio(), labels: view.labels, hover: view.hover, compact: view.compact };
  if (o.theme && o.theme !== app.theme) app.paint(o.theme);
  if (o.labels) view.labels = o.labels;
  view.hover = null; view.compact = !!o.compact;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  if (o.view !== 'current') {
    // labels are larger, relative to the model, than on screen: leave them head room
    const pad = Object.assign({ l: 0.03, r: 0.03, t: (o.title ? top : 0.035) + (o.compact ? 0.03 : 0.065), b: 0.085 }, o.pad);
    const v = fitView(W.fit[o.box || 'all'](), o.theta != null ? o.theta : app.HERO.theta, o.phi != null ? o.phi : app.HERO.phi, w / h, pad);
    const sp = Math.sin(v.phi);
    camera.position.set(v.target.x + v.dist * sp * Math.sin(v.theta), v.target.y + v.dist * Math.cos(v.phi), v.target.z + v.dist * sp * Math.cos(v.theta));
    camera.lookAt(v.target);
  }
  camera.updateMatrixWorld(true);
  renderer.setPixelRatio(1); renderer.setSize(w * ss, h * ss, false);
  app.grid.uniforms.px.value = ss * k * 0.8;
  renderer.render(scene, camera);

  // --- compose: ground, model, labels, text
  const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, P.bg[0]); g.addColorStop(1, P.bg[1]);
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high';
  c.drawImage(renderer.domElement, 0, 0, w, h);
  labels.draw(c, camera, w, h, k, P, false, reserved);
  c.textBaseline = 'alphabetic';
  for (const ln of lines) { let x = m; for (const p of ln.parts) { c.font = p[1]; c.fillStyle = p[2]; c.fillText(p[0], x, ln.y); x += c.measureText(p[0]).width; } }
  // legend, bottom left
  let x = m; const yb = h - m;
  FLOWS.forEach(fl => {
    if (!view.flowShown(fl.id)) return;
    c.strokeStyle = P[fl.key]; c.lineWidth = 3.4 * k; c.lineCap = 'butt';
    c.setLineDash(fl.buildTime ? [6 * k, 4 * k] : []);
    c.beginPath(); c.moveTo(x, yb - 4.5 * k); c.lineTo(x + 24 * k, yb - 4.5 * k); c.stroke(); c.setLineDash([]);
    x += 31 * k;
    c.font = FONT.disp(600, 13.5 * k); c.fillStyle = L.text; c.fillText(fl.name, x, yb); x += c.measureText(fl.name).width + 6 * k;
    c.font = FONT.mono(400, 11.5 * k); c.fillStyle = L.sub; c.fillText(fl.what, x, yb); x += c.measureText(fl.what).width + 20 * k;
  });
  // provenance, bottom right (dropped if the legend needs the room)
  const prov = `snapshot ${model.milestone}${dot}${fmt.utc(model.captured)}${dot}commit ${model.git.commit || 'n/a'}`;
  c.font = FONT.mono(400, 11.5 * k); c.fillStyle = L.sub;
  if (x + c.measureText(prov).width < w - m) { c.textAlign = 'right'; c.fillText(prov, w - m, yb); c.textAlign = 'left'; }

  // --- restore the live view
  view.labels = saved.labels; view.hover = saved.hover; view.compact = saved.compact;
  if (app.theme !== saved.theme) app.paint(saved.theme);
  camera.aspect = saved.aspect; camera.position.copy(saved.pos); camera.quaternion.copy(saved.quat); camera.updateProjectionMatrix(); camera.updateMatrixWorld(true);
  app.grid.uniforms.px.value = 1;
  renderer.setPixelRatio(saved.pr); renderer.setSize(cssW, cssH, false);
  renderer.render(scene, camera);
  return cv;
}

/** Hand a blob to the viewer: claude.ai's save prompt inside an artifact, a plain download anywhere else. */
async function saveBlob(blob, filename) {
  if (window.claude && typeof window.claude.use === 'function') {
    let dl = null;
    try { dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
    if (!dl) return 'preview';
    try { await dl.save({ filename, data: blob }); return 'saved'; }
    catch (e) { return e && e.code === 'declined' ? 'declined' : 'preview'; }
  }
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: filename });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return 'saved';
}
